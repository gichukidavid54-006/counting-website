<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Counting Zone!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="counter-page">
        <header>
            <p class="eyebrow">★ YOUR FRIENDLY WEB ZONE ★</p>
            <h1>The Counting Zone!</h1>
            <p class="subtitle">Click a button. Change your number!</p>
        </header>
        <section class="counter-card" aria-label="Counter">
            <p class="count-label">~* CURRENT COUNT *~</p>
            <p class="count" aria-live="polite">0</p>
            <div class="controls">
                <button type="button" class="minusbtn" aria-label="Decrease count">−</button>
                <button type="button" class="plusbtn" aria-label="Increase count">+</button>
            </div>
        </section>
        <footer>✦ MADE ON THE INTERNET ✦</footer>
    </main>
    <script src="main.js"></script>
</body>
</html>
